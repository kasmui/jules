name: Build Hadits Online APK

on:
  push:
    paths:
      - 'hadits-online-android/**'
      - '.github/workflows/build-hadits-online.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: hadits-online-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hadits-Online-Android
          path: hadits-online-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
